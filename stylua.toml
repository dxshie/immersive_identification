# StyLua config for the Anomaly .script (Lua 5.1) sources.
# Matches the existing hand-written style to keep the diff meaningful: real tabs
# for indentation (what the whole codebase already uses) and a wide column so the
# heavily-commented option tables don't get reflowed. call_parentheses stays the
# default "Always" -- it only touches the `class "X" (Base)` idiom (-> class("X")
# (Base)), which is what it already means, and leaves every explicit-paren call
# untouched (the minimal-churn choice for this codebase).
column_width = 120
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
